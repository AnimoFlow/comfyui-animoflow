# Publish the node pack to the ComfyUI Registry (registry.comfy.org).
#
# DORMANT until the public flip: it only runs on version tags, and it needs
# the REGISTRY_ACCESS_TOKEN secret (created with the "animoflow" publisher
# account at registry.comfy.org). Until both exist, tags simply skip publish.
#
# Release flow once live:
#   1. bump `version` in pyproject.toml
#   2. git tag v<version> && git push --tags

name: Publish to ComfyUI Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'AnimoFlow/comfyui-animoflow' }}
    env:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - name: Check for registry token
        id: gate
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "REGISTRY_ACCESS_TOKEN not configured — skipping publish (create the 'animoflow' publisher at registry.comfy.org, add the secret, then re-run this workflow)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
      - name: Publish node
        if: steps.gate.outputs.publish == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
